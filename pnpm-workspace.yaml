allowBuilds:
  esbuild: true
  # Image resizing (src/collections/Media.ts) downloads its prebuilt binary on install.
  sharp: true
  unrs-resolver: true

overrides:
  # payload@3.90.2 pins undici 7.29.0. 7.30.1 fixes GHSA-xjj6-f33q-929c (high) and two
  # moderate advisories (24 Oct 2026). Remove once Payload ships with undici >=7.30.1.
  undici: 7.30.1
  # Patch releases with security fixes (24 Oct 2026), pulled in by other packages:
  # zod via eslint-plugin-react-hooks (GHSA-mrhx-c7xc-m3w5, high; lint only);
  # fast-uri via payload > ajv (two moderate, two low).
  zod: 4.6.6
  fast-uri: 3.1.9
  # Via @payloadcms/richtext-lexical > @lexical/headless (accepts any version).
  # 21.0.4 fixes GHSA-834v-8h66-3h79 (high). Major version up from 20.14.6.
  happy-dom: 21.0.4
  # Pulled in by the admin's code editor (via @payloadcms/ui). Patch release with security fixes.
  dompurify: 3.4.17

auditConfig:
  ignoreGhsas:
    # braces (stack exhaustion, no fixed release). Only reached through build-time
    # tooling (sass -> chokidar, vite) with patterns from our own code, never user input.
    # Mirrored in osv-scanner.toml with an expiry date. Review by 2026-11-10.
    - GHSA-vfj7-8cjw-p6xm
