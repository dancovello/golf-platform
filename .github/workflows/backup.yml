# Nightly encrypted off-site backup (docs/plans/step-3-backups-migrations-production.md, 3.5).
#
# Streams pg_dump straight into age encryption, so no unencrypted copy is ever written to disk,
# and uploads it to the Cloudflare R2 bucket (EU, objects deleted after 30 days). GitHub only
# holds the public key: it can make backups but never open them.
# If this job fails, GitHub emails Dan. Proper alerting arrives in step 6.
name: Backup

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC every night
  workflow_dispatch:
    inputs:
      environment:
        description: Which database to back up
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["staging","production"]') }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      DATABASE_URL: ${{ matrix.environment == 'production' && secrets.PRODUCTION_DATABASE_URL_DIRECT || secrets.STAGING_DATABASE_URL_DIRECT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BUCKET: golf-platform-backups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the secrets are present
        run: |
          missing=0
          for name in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT; do
            if [ -z "${!name}" ]; then echo "Missing secret for ${name} (${ENVIRONMENT})"; missing=1; fi
          done
          exit $missing

      - name: Install age and a matching Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age postgresql-common > /dev/null
          # pg_dump must be at least the server's version: use the official Postgres apt repo.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          server_major=$(psql "$DATABASE_URL" -Atc 'SHOW server_version_num' | cut -c1-2)
          echo "Database is Postgres ${server_major}"
          sudo apt-get install -y -qq "postgresql-client-${server_major}" > /dev/null
          echo "PG_BIN=/usr/lib/postgresql/${server_major}/bin" >> "$GITHUB_ENV"

      - name: Dump, encrypt and upload
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          key="${ENVIRONMENT}/${stamp}.dump.age"
          # Stream: database -> encryption -> file. The file on disk is already encrypted.
          "${PG_BIN}/pg_dump" --format=custom --no-owner --no-privileges "$DATABASE_URL" \
            | age --encrypt --recipients-file ops/backup-recipient.txt > backup.dump.age
          size=$(stat -c %s backup.dump.age)
          if [ "$size" -lt 1024 ]; then echo "Backup is suspiciously small (${size} bytes)"; exit 1; fi
          sha256sum backup.dump.age | cut -d' ' -f1 > backup.dump.age.sha256
          aws s3 cp backup.dump.age "s3://${BUCKET}/${key}" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp backup.dump.age.sha256 "s3://${BUCKET}/${key}.sha256" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          # Read it back: the uploaded size must match what we made.
          uploaded=$(aws s3api head-object --bucket "$BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)
          if [ "$uploaded" != "$size" ]; then echo "Upload size mismatch (${uploaded} vs ${size})"; exit 1; fi
          echo "Backed up ${ENVIRONMENT}: ${key} (${size} bytes, encrypted)" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f backup.dump.age backup.dump.age.sha256
