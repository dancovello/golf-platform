version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Type definitions must match the Node version we run (24, see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      payload:
        patterns: ['payload', '@payloadcms/*']
      # react and react-dom must always be the same version, so update them in one PR.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
